name: Bug report
description: Report something that is broken or behaving unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      description: What commit or deployment are you on? (optional)
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and device, app version, local vs staging vs production (optional).
      placeholder: e.g. iOS Safari, production
    validations:
      required: false
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce it?
      placeholder: |
            1. ...
            2. ...
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety
      options:
        - label: I have not included real credentials, secrets, emails, USNs, auth IDs, or other users' data in this report.
          required: true
