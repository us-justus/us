name: Feature request
description: Suggest an idea for the product or the codebase.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is affected, and what are they trying to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change, and what should not change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you considered or rejected and why.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria / scope
      description: What would make this PR reviewable?
