name: CI

# The single repository-owned CI workflow.
#
# `fix/cloudflare-build-reliability` and `chore/staging-deploy-pipeline` both
# need this file, so both branches carry a byte-identical copy: git merges two
# identical additions without a conflict and the merged tree has exactly one
# definition.
#
# The check-run name is the job name, `validate`. It is the required check for
# branch protection and the gate used by the staging workflows. Do not rename it
# without updating branch protection and `.github/workflows/deploy-staging.yml`.
#
# This workflow is intentionally read-only: no secrets, no environment, no
# deploy, no Cloudflare credentials. PR-controlled code runs here, so it must
# never be given anything privileged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Merge-queue entries are validated exactly like PR heads. Without this, a
  # queue configured to require `validate` would wait forever: `pull_request`
  # runs do not exist for the synthetic queue commit.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run, so a stale commit
# never keeps the branch hostage and two runs never race on the same cache key.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Corepack downloads the pnpm version declared in `packageManager`; never
  # prompt for confirmation in a non-interactive run.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  # Used only while `.nvmrc` is absent from the branch under test (for example
  # an in-flight Dependabot branch opened before the exact Node pin landed).
  # It must equal the pinned version so every PR is validated with the same
  # toolchain that `main` will use.
  NODE_VERSION_FALLBACK: "24.22.1"

jobs:
  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Node.js version
        id: node
        run: |
          set -euo pipefail
          if [ -f .nvmrc ]; then
            version="$(tr -d '[:space:]' < .nvmrc)"
            echo "Using Node.js ${version} from .nvmrc"
          else
            version="${NODE_VERSION_FALLBACK}"
            echo "::warning::.nvmrc is absent on this branch; falling back to ${version}"
          fi
          case "$version" in
            "" | *[!0-9.]*)
              echo "::error::invalid Node.js version '${version}'"
              exit 1
              ;;
          esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Use Node.js ${{ steps.node.outputs.version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Enable pnpm from package.json packageManager
        run: corepack enable pnpm

      - name: Cache pnpm store and Corepack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Reset local database
        run: pnpm exec supabase db reset --local

      - name: Database tests
        run: pnpm test:db

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup

  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: database

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Resolve pinned Node.js version
        id: node
        run: |
          set -euo pipefail
          if [ -f .nvmrc ]; then
            version="$(tr -d '[:space:]' < .nvmrc)"
            echo "Using Node.js ${version} from .nvmrc"
          else
            version="${NODE_VERSION_FALLBACK}"
            echo "::warning::.nvmrc is absent on this branch; falling back to ${version}"
          fi
          case "$version" in
            "" | *[!0-9.]*)
              echo "::error::invalid Node.js version '${version}'"
              exit 1
              ;;
          esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Use Node.js ${{ steps.node.outputs.version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      # `packageManager` is the only pnpm selector in the repository, so
      # Corepack resolves the same version the Cloudflare build image uses.
      - name: Enable pnpm from package.json packageManager
        run: corepack enable pnpm

      - name: Verify pinned toolchain
        env:
          EXPECTED_NODE: ${{ steps.node.outputs.version }}
        run: |
          set -euo pipefail
          actual_node="$(node -v)"
          actual_node="${actual_node#v}"
          expected_pnpm="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          engines_node="$(node -p "require('./package.json').engines.node")"
          actual_pnpm="$(pnpm -v)"

          {
            echo "### toolchain"
            echo ""
            echo "- node: \`${actual_node}\`"
            echo "- engines.node: \`${engines_node}\`"
            echo "- pnpm: \`${actual_pnpm}\`"
            echo "- packageManager: \`pnpm@${expected_pnpm}\`"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "${actual_node}" != "${EXPECTED_NODE}" ]; then
            echo "::error::Node ${actual_node} does not match the pinned ${EXPECTED_NODE}"
            exit 1
          fi
          if [ "${actual_pnpm}" != "${expected_pnpm}" ]; then
            echo "::error::pnpm ${actual_pnpm} does not match packageManager (${expected_pnpm})"
            exit 1
          fi
          # Exact pins must agree with the selected Node; ranges are accepted
          # while a branch predates the pin (see NODE_VERSION_FALLBACK).
          case "${engines_node}" in
            *">"* | *"<"* | *"^"* | *"~"* | *"|"* | *"x"*)
              echo "engines.node '${engines_node}' is a range; accepted."
              ;;
            *)
              if [ "${engines_node}" != "${EXPECTED_NODE}" ]; then
                echo "::error::engines.node (${engines_node}) does not match the pinned Node (${EXPECTED_NODE})"
                exit 1
              fi
              ;;
          esac

      # The dependency store is content-addressed and safe to restore.
      # `.next/cache` is deliberately NOT cached: a partially restored
      # Turbopack database is what broke production builds (see next.config.ts).
      - name: Cache pnpm store and Corepack downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6.1.0
        with:
          path: |
            ~/.local/share/pnpm/store
            ~/.cache/node/corepack
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies with frozen lockfile
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee "${RUNNER_TEMP}/pnpm-install.log"

      - name: Verify installer version and lockfile integrity
        run: |
          set -euo pipefail
          expected_pnpm="$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"
          installer_version="$(grep -oE 'using pnpm v[0-9]+\.[0-9]+\.[0-9]+' "${RUNNER_TEMP}/pnpm-install.log" | tail -1 | sed 's/using pnpm v//')"

          if [ -z "${installer_version}" ]; then
            echo "::error::Could not read the pnpm version that performed the install"
            cat "${RUNNER_TEMP}/pnpm-install.log"
            exit 1
          fi
          if [ "${installer_version}" != "${expected_pnpm}" ]; then
            echo "::error::Install ran with pnpm ${installer_version}, expected ${expected_pnpm}"
            exit 1
          fi
          if ! git diff --quiet -- pnpm-lock.yaml; then
            echo "::error::pnpm install --frozen-lockfile modified pnpm-lock.yaml"
            git --no-pager diff -- pnpm-lock.yaml
            exit 1
          fi

          echo "Dependency install performed by pnpm ${installer_version}; pnpm-lock.yaml unchanged."

      # `pnpm list` reads the resolved lockfile tree. `require()`ing these
      # packages' own `package.json` is not portable: `@opennextjs/cloudflare`
      # exposes no `./package.json` subpath, so the lookup resolves to
      # `dist/api/package.json.js` and fails the job.
      - name: Record installed dependency versions
        run: pnpm list next @opennextjs/cloudflare wrangler --depth 0

      # `tsc` needs the route/layout types Next generates; without them a clean
      # checkout fails on `LayoutProps`. typegen is the cheap, build-free way to
      # materialise them so type-checking still runs before the build.
      - name: Generate Next.js route types
        run: pnpm exec next typegen

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test:inside

      # 1/4: no `.next` at all -> proves the build does not depend on a restored
      # Turbopack database, and that the OpenNext artifact is complete.
      - name: OpenNext Cloudflare build (clean cache)
        run: |
          set -o pipefail
          rm -rf .next .open-next
          pnpm exec opennextjs-cloudflare build 2>&1 | tee "${RUNNER_TEMP}/build-clean.log"

      - name: Assert OpenNext output structure
        run: |
          set -euo pipefail
          status=0
          for path in .open-next/worker.js .open-next/assets .open-next/assets/_next; do
            if [ ! -e "${path}" ]; then
              echo "::error::clean build did not produce ${path}"
              status=1
            else
              echo "OK: ${path} exists"
            fi
          done
          # A build that silently wrote the Turbopack database would fail on the
          # next restored cache (the original production incident).
          if [ -e .next/cache/turbopack ]; then
            echo "::error::.next/cache/turbopack was written; experimental.turbopackFileSystemCacheForBuild must stay false"
            status=1
          else
            echo "OK: no .next/cache/turbopack directory was created"
          fi
          exit "${status}"

      # 2/4: build with the output produced by the previous run present.
      - name: Build again with generated output present
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "${RUNNER_TEMP}/build-warm.log"

      # 3/4: one more consecutive build of the same commit.
      - name: Build again (consecutive)
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee "${RUNNER_TEMP}/build-consecutive.log"

      # 4/4: regression test for the incident signature itself — a restored
      # cache whose metadata points at artefacts that are no longer there. With
      # the persistent cache disabled the build must ignore it completely.
      - name: Build with a corrupted Turbopack cache present
        run: |
          set -o pipefail
          rm -rf .next .open-next
          mkdir -p .next/cache/turbopack
          printf 'stale-meta-without-sst' >.next/cache/turbopack/00000001.meta
          pnpm exec opennextjs-cloudflare build 2>&1 | tee "${RUNNER_TEMP}/build-corrupt-cache.log"
          if [ ! -f .open-next/worker.js ]; then
            echo "::error::build with a corrupted cache present did not produce .open-next/worker.js"
            exit 1
          fi
          # Our synthetic directory must be left untouched: the cache is never
          # consulted or written, so nothing may appear beside the sentinel.
          if [ "$(ls -A .next/cache/turbopack)" != "00000001.meta" ]; then
            echo "::error::the build wrote into .next/cache/turbopack; the persistent cache must stay disabled"
            ls -A .next/cache/turbopack
            exit 1
          fi

      - name: Assert cache independence
        run: |
          set -euo pipefail
          status=0

          for log in build-clean build-warm build-consecutive build-corrupt-cache; do
            if grep -qE 'TurbopackInternalError|Failed to lookup task ids|Unable to open static sorted file' "${RUNNER_TEMP}/${log}.log"; then
              echo "::error::Turbopack cache/internal error detected in ${log}.log"
              grep -nE 'TurbopackInternalError|Failed to lookup task ids|Unable to open static sorted file' "${RUNNER_TEMP}/${log}.log"
              status=1
            else
              echo "OK: no Turbopack cache/internal error in ${log}.log"
            fi
          done

          exit "${status}"
