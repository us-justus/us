name: ci

# Repository-owned CI. This is the source of truth for the `validate` check that
# deploy-staging.yml gates on: a staging deploy must not depend on a third-party
# integration (Cloudflare Workers Builds) publishing check runs for this repo.
#
# Runs on every push to main and every PR targeting main, so a main commit
# always carries a `validate` check run before it can be dispatched to staging.
#
# This workflow is read-only: no secrets, no environment, no deploys.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # The check-run name is this job name; deploy-staging.yml requires it by
    # default (override with the repository variable STAGING_REQUIRED_CHECKS).
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4 # packageManager: pnpm@11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines.node >= 24.7.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # next-env.d.ts is gitignored and regenerated by Next 16; tsc needs it
      # because src/app/layout.tsx imports ./globals.css.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Unit tests
        run: pnpm test:inside

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint
