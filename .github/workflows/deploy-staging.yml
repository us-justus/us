name: deploy-staging

# Manual, SHA-pinned deployment to the `us-staging` Worker (wrangler.jsonc ->
# env.staging). Production (`us`) is deployed by Cloudflare Workers Builds and is
# deliberately NOT handled here: this workflow never runs without `--env staging`,
# so it cannot resolve the top-level Worker name.
#
# Fail-closed gates, in order:
#   0. the run was dispatched from main (any other ref is skipped outright)
#   1. input is a single full 40-char commit SHA
#   2. the checked-out commit is exactly that SHA
#   3. the commit is an ancestor of origin/main
#   4. every CI check / commit status on that SHA is finished and green, and
#      the repository-owned `validate` check (ci.yml) actually ran
#   5. all staging variables + credentials exist, the Supabase URL is exactly
#      the staging project (never production), and STAGING_BASE_URL is an
#      allowed staging host
#   6. validation (tests, tsc, lint) passes and the OpenNext build succeeds
#   7. the `us-staging` Worker already carries the secrets it needs at runtime
#      (Wrangler deletes dashboard plaintext vars on deploy; secrets are kept)
#   8. the live Worker answers the existing smoke suite, re-validating the URL
#
# GitHub `staging` environment requirements (see docs/staging-deployment.md):
# deployment branch policy = main only, plus required reviewers for the
# explicit approval before anything reaches the Cloudflare account.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit SHA on main to deploy to us-staging
        required: true
        type: string

permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: us-staging
    # Staging only ever deploys main. A dispatch from any other ref is skipped
    # before the job starts, so no step runs and no environment secret is
    # materialised.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging # staging-scoped variables + secrets only
    timeout-minutes: 40

    steps:
      - name: Validate target SHA
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sha="$(printf '%s' "${INPUT_SHA:-}" | tr '[:upper:]' '[:lower:]')"
          # Whole-string match: any character outside [0-9a-f] — including a
          # newline from a multi-line paste — fails. This also keeps a hostile
          # input from injecting extra lines into $GITHUB_OUTPUT.
          case "$sha" in
            "" | *[!0-9a-f]*)
              echo "::error::input 'sha' must be a single full 40-character commit SHA"
              exit 1
              ;;
          esac
          if [ "${#sha}" -ne 40 ]; then
            echo "::error::input 'sha' must be a full 40-character commit SHA (got ${#sha} characters)"
            exit 1
          fi
          echo "sha=$sha" >>"$GITHUB_OUTPUT"

      - name: Check out the target commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0 # full history so origin/main exists for the ancestry check
          persist-credentials: false

      - name: Confirm the checkout is the target commit, on main
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "::error::checked out $actual but expected $EXPECTED_SHA"
            exit 1
          fi
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "::error::origin/main is unavailable; cannot verify branch membership"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" origin/main; then
            echo "::error::$EXPECTED_SHA is not on main; staging only takes main commits"
            exit 1
          fi
          {
            echo "### staging deploy"
            echo ""
            echo "- commit: \`$EXPECTED_SHA\`"
            echo "- branch: main"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Verify CI checks passed on the target commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          REQUIRED_CHECKS: ${{ vars.STAGING_REQUIRED_CHECKS }}
        run: |
          set -euo pipefail

          check_runs="$(gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" \
            --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"

          commit_statuses="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/status" \
            --jq '.statuses[] | [.context, .state] | @tsv')"

          if [ -z "$check_runs" ] && [ -z "$commit_statuses" ]; then
            echo "::error::no CI results are attached to ${TARGET_SHA}; refusing to deploy an unverified commit"
            exit 1
          fi

          failed=0

          while IFS=$'\t' read -r name status conclusion; do
            [ -n "${name:-}" ] || continue
            if [ "${status:-}" != "completed" ]; then
              echo "::error::check '$name' is not finished (status=${status:-unknown})"
              failed=1
              continue
            fi
            case "${conclusion:-}" in
              success | neutral | skipped) ;;
              *)
                echo "::error::check '$name' concluded '${conclusion:-none}'"
                failed=1
                ;;
            esac
          done <<<"$check_runs"

          while IFS=$'\t' read -r context state; do
            [ -n "${context:-}" ] || continue
            case "${state:-}" in
              success | neutral | skipped) ;;
              *)
                echo "::error::commit status '$context' is '${state:-unknown}'"
                failed=1
                ;;
            esac
          done <<<"$commit_statuses"

          # Required check names, comma- or newline-separated, e.g.
          # "validate,Workers Builds: us". Split on separators only and trim
          # each item — never whitespace-strip, because check names contain
          # spaces. Defaults to the repository-owned `validate` job (ci.yml) so
          # the gate never depends on a third-party integration publishing
          # check runs for this repo.
          required="${REQUIRED_CHECKS:-validate}"
          while IFS= read -r want; do
            want="$(printf '%s' "$want" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -n "$want" ] || continue
            if ! printf '%s\n' "$check_runs" | cut -f1 | grep -Fxq -- "$want"; then
              echo "::error::required check '$want' did not run on $TARGET_SHA"
              failed=1
            fi
          done < <(printf '%s\n' "$required" | tr ',' '\n')

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "- CI: all checks on the target commit are green" >>"$GITHUB_STEP_SUMMARY"

      - name: Guard staging configuration and credentials
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "$SUPABASE_URL" ] || { echo "::error::staging variable NEXT_PUBLIC_SUPABASE_URL is missing"; missing=1; }
          [ -n "$SUPABASE_ANON_KEY" ] || { echo "::error::staging variable NEXT_PUBLIC_SUPABASE_ANON_KEY is missing"; missing=1; }
          [ -n "$STAGING_BASE_URL" ] || { echo "::error::staging variable STAGING_BASE_URL is missing"; missing=1; }
          [ -n "$CF_API_TOKEN" ] || { echo "::error::staging secret CLOUDFLARE_API_TOKEN_STAGING is missing"; missing=1; }
          [ -n "$CF_ACCOUNT_ID" ] || { echo "::error::staging secret CLOUDFLARE_ACCOUNT_ID_STAGING is missing"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::staging environment is incomplete; refusing to build or deploy"
            exit 1
          fi

          # The Supabase project is inlined into the build, so this is the only
          # place that can keep staging off the production database. Compare the
          # exact origin: substring matching would accept lookalikes such as
          # https://ietruyukgqwkmsyfvxxi.supabase.co.evil.com.
          if [ "$SUPABASE_URL" != "https://ietruyukgqwkmsyfvxxi.supabase.co" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL must be exactly https://ietruyukgqwkmsyfvxxi.supabase.co (the staging project)"
            exit 1
          fi

          # Exact-host staging URL guard; the smoke step re-runs it after deploy.
          bash scripts/check-staging-url.sh "$STAGING_BASE_URL"

      - uses: pnpm/action-setup@v4 # packageManager: pnpm@11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # engines.node >= 24.7.0
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # next-env.d.ts is gitignored and regenerated by Next 16; tsc needs it
      # before `opennextjs-cloudflare build` runs (layout.tsx imports CSS).
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Unit tests
        run: pnpm test:inside

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Build with staging Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: staging # /inside health label; display-only
        run: pnpm exec opennextjs-cloudflare build

      - name: Verify us-staging Worker secrets are provisioned
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
        run: |
          set -euo pipefail
          # `wrangler deploy` deletes dashboard plaintext vars when the config
          # declares none (it keeps secrets). This asserts the runtime config
          # staging needs exists BEFORE the code is replaced.
          existing="$(pnpm exec wrangler secret list --env staging | jq -r '.[].name' | sort -u)"
          required="$(printf '%s\n' \
            ADMIN_SECRET_KEY \
            BREVO_API_KEY \
            BREVO_SENDER_EMAIL \
            SUPABASE_SERVICE_ROLE_KEY | sort -u)"
          missing="$(comm -23 <(printf '%s\n' "$required") <(printf '%s\n' "$existing"))"
          if [ -n "$missing" ]; then
            echo "::error::us-staging is missing required Worker secrets: $(printf '%s' "$missing" | tr '\n' ' ')"
            echo "::error::set them with: pnpm exec wrangler secret put <NAME> --env staging"
            exit 1
          fi

      - name: Deploy to us-staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
        run: pnpm exec opennextjs-cloudflare deploy --env staging

      - name: Smoke test the live staging deployment
        env:
          STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          # Re-validated here on purpose: this step must not inherit trust from
          # the earlier config guard. Empty or production values are rejected.
          bash scripts/check-staging-url.sh "${STAGING_BASE_URL:-}"
          {
            echo "- worker: us-staging"
            echo "- url: $STAGING_BASE_URL"
          } >>"$GITHUB_STEP_SUMMARY"
          node scripts/smoke-prod.mjs "$STAGING_BASE_URL"
