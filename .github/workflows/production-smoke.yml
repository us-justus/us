name: Production smoke

# Manual, read-only production smoke gate.
#
# Runs the repository's production smoke script (`scripts/smoke-prod.mjs`) against
# a caller-chosen live deployment. It performs GET-only checks and writes nothing.
#
# This workflow is intentionally manual: it must never run against production
# automatically, and it must never hold secrets. The deployment it validates is
# produced by Cloudflare Workers Builds from `main` (see docs/deployment.md).

on:
  workflow_dispatch:
    inputs:
      base-url:
        description: "Base URL of the live deployment to smoke."
        required: false
        default: "https://us-justus.in"
        type: string

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: production-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false

      - name: Resolve pinned Node.js version
        id: node
        run: |
          set -euo pipefail
          version="${NODE_VERSION_FALLBACK}"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Use Node.js ${{ steps.node.outputs.version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node v4.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Enable pnpm from package.json packageManager
        run: corepack enable pnpm

      - name: Production smoke gate
        env:
          SMOKE_BASE_URL: ${{ inputs.base-url || 'https://us-justus.in' }}
        run: node scripts/smoke-prod.mjs
